<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14244d">
<title>육도윤회 심리테스트</title>
<meta name="description" content="15개의 질문으로 최근 내 마음이 머무는 곳을 알아보는 육도윤회 심리테스트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #14244d;
    --night-deep: #0b1433;
    --text: #ffffff;
    --text-sub: rgba(255, 255, 255, 0.78);
    --btn-bg: rgba(10, 16, 40, 0.55);
    --btn-bg-hover: rgba(40, 52, 110, 0.7);
    --btn-border: rgba(255, 255, 255, 0.35);
    --accent: #ffd45c;
    --fade: 0.6s;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--night-deep);
    color: var(--text);
    font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    word-break: keep-all;
  }

  /* ---------- 공통 화면 ---------- */
  .screen {
    position: fixed;
    inset: 0;
    height: 100dvh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: var(--night);
    opacity: 0;
    visibility: hidden;
    transition: opacity var(--fade) ease, visibility 0s linear var(--fade);
    overflow: hidden;
  }
  .screen.active {
    opacity: 1;
    visibility: visible;
    transition: opacity var(--fade) ease, visibility 0s linear 0s;
  }

  /* 이미지에 글씨가 있는 화면(시작, 완료) : 세로 화면에서도 글씨가 잘리지 않도록
     배경은 cover(흐리게)로 꽉 채우고, 원본은 contain으로 위에 한 번 더 올림 */
  .screen.tap { cursor: pointer; }
  .screen.tap .full {
    position: absolute;
    inset: 0;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
  }
  .screen.tap::before {
    content: "";
    position: absolute;
    inset: -30px;
    background: inherit;
    background-size: cover;
    filter: blur(18px) brightness(0.85);
  }
  @media (min-aspect-ratio: 13/10) {
    /* 가로로 넓은 화면에선 원래 요구대로 cover 하나만 사용 */
    .screen.tap .full { background-size: cover; }
    .screen.tap::before { display: none; }
  }

  .tap-hint {
    position: absolute;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font-size: 1rem;
    color: #fff;
    letter-spacing: 0.04em;
    animation: blink 1.8s ease-in-out infinite;
    white-space: nowrap;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
  }
  @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

  /* ---------- 1. 시작 ---------- */
  #intro { background-image: url('KakaoTalk_20260923_205858619.jpg'); }
  #intro .full { background-image: url('KakaoTalk_20260923_205858619.jpg'); }

  /* ---------- 2. 질문 ---------- */
  #quiz {
    background-image:
      linear-gradient(rgba(8, 12, 32, 0.25), rgba(8, 12, 32, 0.45)),
      url('KakaoTalk_20260923_205858619_01.jpg');
  }
  .quiz-inner {
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 6px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.15);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, #f5c6ff, var(--accent));
    transition: width 0.5s ease;
  }

  .q-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px 0 8px;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .q-box.out { opacity: 0; transform: translateY(10px); }

  .q-num {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 1.6rem;
    color: var(--accent);
    text-align: center;
    text-shadow: 0 2px 12px rgba(255, 212, 92, 0.35);
  }
  .q-text {
    margin: 10px 0 24px;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 1.28rem;
    line-height: 1.55;
    text-align: center;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
  }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    width: 100%;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    text-align: left;
    padding: 13px 16px;
    border: 1px solid var(--btn-border);
    border-radius: 14px;
    background: var(--btn-bg);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: var(--text);
    font: inherit;
    font-size: 0.95rem;
    line-height: 1.5;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }
  .choice .key {
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.5);
    display: grid;
    place-items: center;
    font-size: 0.78rem;
    font-weight: 700;
    margin-top: 1px;
  }
  @media (hover: hover) {
    .choice:hover { background: var(--btn-bg-hover); border-color: rgba(255, 255, 255, 0.7); }
  }
  .choice:active, .choice.picked {
    transform: scale(0.98);
    background: rgba(255, 212, 92, 0.22);
    border-color: var(--accent);
  }
  .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .back-btn {
    align-self: center;
    margin-top: 16px;
    background: none;
    border: none;
    color: var(--text-sub);
    font: inherit;
    font-size: 0.85rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 6px 10px;
  }
  .back-btn[hidden] { display: none; }

  /* ---------- 3. 완료 ---------- */
  #done { background-image: url('KakaoTalk_20260923_205858619_02.jpg'); }
  #done .full { background-image: url('KakaoTalk_20260923_205858619_02.jpg'); }

  /* ---------- 4. 결과 카드 ---------- */
  #cards { background-image: url('KakaoTalk_20260923_205858619_03.jpg'); overflow-y: auto; }
  .cards-inner {
    max-width: 720px;
    margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  .score-box { text-align: center; margin-bottom: 20px; }
  .score-label { font-size: 0.9rem; color: var(--text-sub); }
  .score-value {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 3rem;
    line-height: 1.2;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(255, 212, 92, 0.45);
  }
  .score-value small { font-size: 1.3rem; margin-left: 2px; }
  .score-guide { font-size: 0.95rem; line-height: 1.6; }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media (min-width: 640px) { .card-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }

  .card {
    position: relative;
    aspect-ratio: 1 / 1;
    border: none;
    border-radius: 14px;
    overflow: hidden;
    padding: 0;
    cursor: pointer;
    background: linear-gradient(160deg, #1d1b5c, #4a2f8a);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transform: translateY(16px) scale(0.96);
  }
  #cards.active .card {
    animation: cardIn 0.6s ease forwards;
    animation-delay: calc(var(--i) * 0.1s + 0.2s);
  }
  @keyframes cardIn { to { opacity: 1; transform: none; } }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
  @media (hover: hover) { .card:hover img { transform: scale(1.04); } }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  /* 이미지가 없을 때 보이는 대체 텍스트 */
  .card .fallback {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 1.3rem;
    color: #fff;
    line-height: 1.4;
  }
  .card.no-img img { display: none; }
  .card.no-img .fallback { display: grid; }

  .card.shake { animation: shake 0.45s ease both !important; opacity: 1; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    max-width: calc(100% - 32px);
    padding: 12px 18px;
    border-radius: 12px;
    background: rgba(10, 14, 36, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.25);
    font-size: 0.9rem;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 30;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 결과 모달 ---------- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(4, 6, 20, 0.75);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0s linear 0.4s;
  }
  .modal.open { opacity: 1; visibility: visible; transition: opacity 0.4s ease, visibility 0s; }
  .modal-box {
    position: relative;
    width: 100%;
    max-width: 900px;
    max-height: calc(100dvh - 32px);
    overflow-y: auto;
    border-radius: 18px;
    background: #fff;
    color: #222;
    transform: translateY(20px) scale(0.97);
    transition: transform 0.4s ease;
  }
  .modal.open .modal-box { transform: none; }
  .modal-img { width: 100%; display: block; }
  .modal-img[hidden] { display: none; }

  .result-text { padding: 24px 22px 8px; text-align: center; }
  .result-text h2 {
    display: inline-block;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 2rem;
    padding: 2px 28px;
    border: 2px solid var(--c);
    border-radius: 99px;
    color: var(--c);
  }
  .result-text .sub { margin: 14px 0 12px; font-weight: 700; font-size: 1.05rem; color: var(--c); line-height: 1.5; }
  .result-text p { font-size: 0.95rem; line-height: 1.85; text-align: left; }
  .result-text mark { background: var(--m); color: inherit; padding: 0 2px; border-radius: 3px; }
  /* 결과 이미지가 있으면: 넓은 화면은 이미지만, 좁은 화면은 이미지 + 읽기 쉬운 글씨 */
  .modal-box.has-img .result-text { display: none; }
  @media (max-width: 700px) {
    .modal-box.has-img .result-text { display: block; }
    .modal-box.has-img .result-text h2 { display: none; }
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding: 18px 20px 22px;
  }
  .modal-actions button {
    flex: 1;
    max-width: 200px;
    padding: 12px 10px;
    border-radius: 12px;
    font: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .btn-close { background: #fff; color: #333; border: 1px solid #ccc; }
  .btn-retry { background: var(--night); color: #fff; border: 1px solid var(--night); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<!-- 1단계: 시작 화면 -->
<section class="screen tap active" id="intro" aria-label="시작 화면. 누르면 테스트가 시작됩니다" role="button" tabindex="0">
  <div class="full"></div>
  <span class="tap-hint">화면을 터치해서 시작하기</span>
</section>

<!-- 2단계: 질문 화면 -->
<section class="screen" id="quiz" aria-label="테스트 문항">
  <div class="quiz-inner">
    <div>
      <div class="progress-top"><span>육도윤회 심리테스트</span><span id="progressText">1 / 15</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="q-box" id="qBox">
      <div class="q-num" id="qNum">Q1.</div>
      <h1 class="q-text" id="qText"></h1>
      <div class="choices" id="choices"></div>
      <button class="back-btn" id="backBtn" type="button" hidden>← 이전 문항</button>
    </div>
  </div>
</section>

<!-- 3단계: 완료 화면 -->
<section class="screen tap" id="done" aria-label="테스트 완료. 누르면 결과 카드로 이동합니다" role="button" tabindex="0">
  <div class="full"></div>
  <span class="tap-hint">화면을 터치해서 넘기기</span>
</section>

<!-- 4단계: 결과 카드 -->
<section class="screen" id="cards" aria-label="결과 카드 선택">
  <div class="cards-inner">
    <div class="score-box">
      <div class="score-label">나의 최종 점수</div>
      <div class="score-value"><span id="scoreValue">0</span><small>점</small></div>
      <p class="score-guide">내 점수가 적힌 카드를 찾아 눌러보세요!</p>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </div>
</section>

<!-- 결과 모달 -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
  <div class="modal-box" id="modalBox">
    <img class="modal-img" id="modalImg" alt="">
    <div class="result-text" id="resultText">
      <h2 id="resultTitle"></h2>
      <div class="sub" id="resultSub"></div>
      <p id="resultBody"></p>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-close" id="closeBtn">카드 다시 보기</button>
      <button type="button" class="btn-retry" id="retryBtn">다시 테스트하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   점수 규칙 : 선택지마다 해당하는 세계의 점수를 받음
   지옥도 1 · 아귀도 2 · 축생도 3 · 수라도 4 · 인간도 5 · 천상도 6
   → 15문항 합계 15 ~ 90점
   ========================================================= */
const QUESTIONS = [
  { q: '내가 은근히 원하던 칭찬을 친구가 받았다.', a: [
    ['나도 저런 인정을 받고 싶어서 사람들이 그 친구에게 어떻게 반응하는지 계속 신경 쓰인다.', 2],
    ['잠깐 부러운 마음이 들었다는 걸 인정하고, 다시 내가 할 수 있는 것에 집중한다.', 5],
    ['친구를 축하해주고, 나도 지금 내가 가진 것에 꽤 만족한다.', 6],
    ['다음에는 반드시 내가 더 잘해야겠다는 생각이 든다.', 4],
    ['그냥 넘기고 원래 하던 걸 한다. 왜 마음이 묘한지는 별로 생각하지 않는다.', 3],
    ['괜히 꼴 보기 싫고, 속으로 선뜻 마음 깊이 축하해주기가 힘들다.', 1] ] },
  { q: '열심히 준비한 일이 예상과 다르게 꼬였다.', a: [
    ['결과가 계속 머릿속에 남아서 다른 일을 하면서도 쉽게 놓이지 않는다.', 2],
    ['생각하기 싫어져 일단 미뤄두고 다른 재미있는 걸 찾는다.', 3],
    ['“오늘은 그냥 쉬라는 날인가 보다.” 하고 잠시 편하게 쉰다.', 6],
    ['남들은 잘하고 있는데 나만 뒤처진 것 같아 나를 더 몰아붙인다.', 4],
    ['나를 방해한 인물이나 환경부터 생각나고, 짜증이 난다.', 1],
    ['왜 안됐는지 살펴보고, 지금 바꿀 수 있는 것부터 다시 정리한다.', 5] ] },
  { q: 'SNS에 올린 게시물의 반응이 생각보다 적다.', a: [
    ['좋아요나 조회수를 몇 번이고 다시 확인하게 된다.', 2],
    ['내가 왜 반응을 기대했는지 잠깐 생각해보고, 부질 없다고 느끼면 신경을 끈다.', 5],
    ['내가 올리고 싶어서 올린 거니까 됐다고 생각한다.', 6],
    ['별생각 없이 다음 피드나 쇼츠를 계속 넘긴다.', 3],
    ['비슷한 친구의 계정과 반응 수를 비교하고 다음에는 더 잘 나오게 하고 싶어진다.', 4],
    ['반응 없는 사람들에게 괜히 서운하고, 팔로우를 취소하거나 게시물을 지운다.', 1] ] },
  { q: '갖고 싶었던 물건이 ‘오늘까지만 한정 판매’라고 한다.', a: [
    ['정말 필요한지, 지금 사도 괜찮은지 생각해본 뒤 결정한다.', 5],
    ['갖고 싶고 부담도 없다면 기분 좋게 사고 만족한다.', 6],
    ['품절될까 계속 확인하게 되고, 지금 안 사면 큰일 날 것처럼 느껴진다.', 2],
    ['친구보다 먼저 사거나 더 좋은 버전을 가져야 괜히 마음이 놓인다.', 4],
    ['돈이 없거나, 품절이 되는 등 못 사게 되는 상황이 오면 짜증이 난다.', 1],
    ['눈에 들어오면 일단 구매하고, 나중에 생각한다.', 3] ] },
  { q: '여러 명이 함께 하는 일에서 내 의견과 다른 의견이 나왔다.', a: [
    ['상대의 말을 들어보고 내 의견도 설명한 뒤, 절충하거나 더 나은 쪽을 선택하려 한다.', 5],
    ['다른 사람 의견 보다는 내 의견이 채택되길 원한다.', 2],
    ['분위기도 괜찮고 결과도 나쁘지 않다면 굳이 내 의견을 끝까지 밀지는 않는다.', 6],
    ['분위기가 불편해지는 게 싫어서 그냥 아무 말 없이 따라간다.', 3],
    ['괜히 상대방의 말과 행동이 거슬린다.', 1],
    ['내 의견이 더 낫다는 걸 증명하려 한다.', 4] ] },

const KEYS = ['A', 'B', 'C', 'D', 'E', 'F'];
const $ = (id) => document.getElementById(id);

let current = 0;
let picks = [];      // 문항별로 받은 점수
let locked = false;  // 전환 중 중복 클릭 방지

/* ---------- 화면 전환 ---------- */
function show(id) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === id));
}

/* ---------- 질문 ---------- */
function renderQuestion() {
  const item = QUESTIONS[current];
  $('qNum').textContent = `Q${current + 1}.`;
  $('qText').textContent = item.q;
  $('progressText').textContent = `${current + 1} / ${QUESTIONS.length}`;
  $('progressFill').style.width = `${(current / QUESTIONS.length) * 100}%`;
  $('backBtn').hidden = current === 0;

  const box = $('choices');
  box.innerHTML = '';
  item.a.forEach(([text, score], i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice';
    btn.innerHTML = `<span class="key">${KEYS[i]}</span><span></span>`;
    btn.lastChild.textContent = text;
    btn.addEventListener('click', () => choose(btn, score));
    box.appendChild(btn);
  });
}

function swapQuestion(next) {
  const qBox = $('qBox');
  qBox.classList.add('out');
  setTimeout(() => {
    next();
    qBox.classList.remove('out');
    $('quiz').querySelector('.quiz-inner').scrollTop = 0;
    locked = false;
  }, 300);
}

function choose(btn, score) {
  if (locked) return;
  locked = true;
  btn.classList.add('picked');
  picks[current] = score;

  if (current < QUESTIONS.length - 1) {
    swapQuestion(() => { current++; renderQuestion(); });
  } else {
    $('progressFill').style.width = '100%';
    setTimeout(() => { show('done'); locked = false; }, 350);
  }
}

$('backBtn').addEventListener('click', () => {
  if (locked || current === 0) return;
  locked = true;
  swapQuestion(() => { current--; picks.length = current; renderQuestion(); });
});

/* ---------- 결과 카드 ---------- */
const totalScore = () => picks.reduce((sum, s) => sum + s, 0);
const resultFor = (score) => RESULTS.find((r) => score >= r.min && score <= r.max);

function buildCards() {
  const grid = $('cardGrid');
  RESULTS.forEach((r, i) => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.style.setProperty('--i', i);
    card.setAttribute('aria-label', `${r.min}점 ~ ${r.max}점 카드`);
    card.innerHTML = `<img src="${r.card}" alt=""><span class="fallback">${r.min}점<br>~${r.max}점</span>`;
    card.querySelector('img').addEventListener('error', () => card.classList.add('no-img'));
    card.addEventListener('click', () => pickCard(card, r));
    grid.appendChild(card);
  });
}

function pickCard(card, r) {
  const score = totalScore();
  if (score < r.min || score > r.max) {
    card.classList.remove('shake');
    void card.offsetWidth; // 애니메이션 다시 시작
    card.classList.add('shake');
    toast(`내 점수는 ${score}점! ${resultFor(score).min}~${resultFor(score).max}점 카드를 찾아보세요`);
    return;
  }
  openResult(r);
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- 결과 모달 ---------- */
function openResult(r) {
  const box = $('modalBox');
  const img = $('modalImg');
  box.style.setProperty('--c', r.c);
  box.style.setProperty('--m', r.m);
  $('resultTitle').textContent = r.name;
  $('resultSub').textContent = r.sub;
  $('resultBody').innerHTML = r.body;

  box.classList.remove('has-img');
  img.hidden = true;
  img.onload = () => { img.hidden = false; box.classList.add('has-img'); };
  img.onerror = () => { img.hidden = true; box.classList.remove('has-img'); };
  img.alt = `${r.name} 결과`;
  img.src = r.img;

  $('toast').classList.remove('show');
  box.scrollTop = 0;
  $('modal').classList.add('open');
  $('closeBtn').focus({ preventScroll: true });
}

function closeResult() { $('modal').classList.remove('open'); }

$('closeBtn').addEventListener('click', closeResult);
$('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeResult(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeResult(); });

$('retryBtn').addEventListener('click', () => {
  closeResult();
  current = 0;
  picks = [];
  renderQuestion();
  setTimeout(() => show('intro'), 200);
});

/* ---------- 시작 / 완료 화면 (어디를 눌러도 넘어감) ---------- */
function onActivate(el, fn) {
  el.addEventListener('click', fn);
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
}
onActivate($('intro'), () => { renderQuestion(); show('quiz'); });
onActivate($('done'), () => {
  $('scoreValue').textContent = totalScore();
  show('cards');
});

[
  'KakaoTalk_20260923_205858619_01.jpg',

  'KakaoTalk_20260923_205858619_03.jpg',
  ...RESULTS.flatMap((r) => [r.card, r.img])
].forEach((src) => { new Image().src = src; });

buildCards();
renderQuestion();
