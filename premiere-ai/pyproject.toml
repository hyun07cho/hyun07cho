[project]
name = "premiere-ai"
version = "0.1.0"
description = "자연어 지시로 프리미어 프로 컷 편집·자막·효과음을 자동 생성"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
subtitles = ["faster-whisper>=1.0"]
dev = ["pytest"]

[project.scripts]
premiere-ai = "premiere_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["premiere_ai*"]
